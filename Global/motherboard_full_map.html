<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메인보드 전체 구조도</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #f5f4ef;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
  }
  .card {
    background: white;
    border-radius: 16px;
    padding: 24px;
    max-width: 720px;
    width: 100%;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  svg text { font-family: system-ui, -apple-system, sans-serif; fill: #2c2c2a; }
  svg text.th { font-size: 14px; font-weight: 500; }
  svg text.ts { font-size: 12px; font-weight: 400; fill: #5f5e5a; }
  /* c-teal */
  .c-teal rect, .c-teal circle { fill: #E1F5EE; stroke: #0F6E56; }
  .c-teal text.th { fill: #085041; }
  .c-teal text.ts { fill: #0F6E56; }
  /* c-purple */
  .c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
  .c-purple text.th { fill: #3C3489; }
  .c-purple text.ts { fill: #534AB7; }
  /* c-amber */
  .c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
  .c-amber text.th { fill: #633806; }
  .c-amber text.ts { fill: #854F0B; }
  /* c-gray */
  .c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
  .c-gray text.th { fill: #444441; }
  .c-gray text.ts { fill: #5F5E5A; }
  .node { cursor: pointer; }
  .node:hover rect { opacity: 0.85; }
</style>
</head>
<body>
<div class="card">
<svg width="100%" viewBox="0 0 680 980" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 메인보드 외곽 -->
  <rect x="8" y="8" width="664" height="964" rx="18" fill="none" stroke="#888780" stroke-width="2"/>
  <circle cx="26" cy="26" r="5" fill="none" stroke="#b4b2a9" stroke-width="1"/>
  <circle cx="654" cy="26" r="5" fill="none" stroke="#b4b2a9" stroke-width="1"/>
  <circle cx="26" cy="962" r="5" fill="none" stroke="#b4b2a9" stroke-width="1"/>
  <circle cx="654" cy="962" r="5" fill="none" stroke="#b4b2a9" stroke-width="1"/>
  <text class="ts" x="340" y="22" text-anchor="middle" dominant-baseline="central" style="font-size:11px;opacity:0.4">SYSTEM BOARD  REV 1.0</text>

  <!-- CPU -->
  <g class="node c-teal">
    <rect x="22" y="34" width="148" height="120" rx="8" stroke-width="0.8"/>
    <text class="th" x="96" y="58" text-anchor="middle" dominant-baseline="central">CPU</text>
    <text class="ts" x="96" y="76" text-anchor="middle" dominant-baseline="central">ALU · 레지스터</text>
    <text class="ts" x="96" y="92" text-anchor="middle" dominant-baseline="central">L1/L2/L3 캐시</text>
    <text class="ts" x="96" y="108" text-anchor="middle" dominant-baseline="central">명령어 실행</text>
    <text class="ts" x="96" y="124" text-anchor="middle" dominant-baseline="central">syscall 트랩 처리</text>
    <text class="ts" x="96" y="140" text-anchor="middle" dominant-baseline="central">인터럽트 핸들링</text>
  </g>

  <!-- RAM -->
  <g class="node c-teal">
    <rect x="186" y="34" width="148" height="120" rx="8" stroke-width="0.8"/>
    <text class="th" x="260" y="58" text-anchor="middle" dominant-baseline="central">RAM</text>
    <text class="ts" x="260" y="76" text-anchor="middle" dominant-baseline="central">커널 코드 · 데이터</text>
    <text class="ts" x="260" y="92" text-anchor="middle" dominant-baseline="central">프로세스 메모리</text>
    <text class="ts" x="260" y="108" text-anchor="middle" dominant-baseline="central">page cache · dcache</text>
    <text class="ts" x="260" y="124" text-anchor="middle" dominant-baseline="central">CWD 포인터</text>
    <text class="ts" x="260" y="140" text-anchor="middle" dominant-baseline="central">소켓 · 오디오 버퍼</text>
  </g>

  <!-- GPU -->
  <g class="node c-teal">
    <rect x="350" y="34" width="148" height="120" rx="8" stroke-width="0.8"/>
    <text class="th" x="424" y="58" text-anchor="middle" dominant-baseline="central">GPU</text>
    <text class="ts" x="424" y="76" text-anchor="middle" dominant-baseline="central">쉐이더 실행</text>
    <text class="ts" x="424" y="92" text-anchor="middle" dominant-baseline="central">프레임버퍼</text>
    <text class="ts" x="424" y="108" text-anchor="middle" dominant-baseline="central">VRAM 관리</text>
    <text class="ts" x="424" y="124" text-anchor="middle" dominant-baseline="central">픽셀 → HDMI 출력</text>
    <text class="ts" x="424" y="140" text-anchor="middle" dominant-baseline="central">DirectX / Vulkan</text>
  </g>

  <!-- 오디오 칩 -->
  <g class="node c-purple">
    <rect x="514" y="34" width="148" height="120" rx="8" stroke-width="0.8"/>
    <text class="th" x="588" y="58" text-anchor="middle" dominant-baseline="central">오디오 칩 / DAC</text>
    <text class="ts" x="588" y="76" text-anchor="middle" dominant-baseline="central">PCM 샘플 수신</text>
    <text class="ts" x="588" y="92" text-anchor="middle" dominant-baseline="central">디지털 → 아날로그</text>
    <text class="ts" x="588" y="108" text-anchor="middle" dominant-baseline="central">믹싱 · 볼륨 조절</text>
    <text class="ts" x="588" y="124" text-anchor="middle" dominant-baseline="central">→ 스피커 포트</text>
    <text class="ts" x="588" y="140" text-anchor="middle" dominant-baseline="central">WASAPI · ALSA</text>
  </g>

  <!-- CPU ↔ RAM -->
  <line x1="170" y1="80" x2="184" y2="80" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="184" y1="94" x2="170" y2="94" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- RAM ↔ GPU -->
  <line x1="334" y1="80" x2="348" y2="80" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="348" y1="94" x2="334" y2="94" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- GPU → 오디오 -->
  <line x1="498" y1="80" x2="512" y2="80" stroke="#7F77DD" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- PCIe 버스 -->
  <rect x="22" y="168" width="640" height="22" rx="4" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="6 3"/>
  <text class="ts" x="340" y="179" text-anchor="middle" dominant-baseline="central">PCIe / 시스템 버스</text>

  <!-- 커널 영역 외곽 -->
  <g class="c-purple">
    <rect x="22" y="202" width="636" height="290" rx="10" stroke-width="0.5"/>
    <text class="th" x="42" y="222" dominant-baseline="central">OS 커널 (소프트웨어 계층)</text>
  </g>

  <!-- 드라이버 행 -->
  <g class="node c-amber">
    <rect x="34" y="232" width="140" height="56" rx="6" stroke-width="0.5"/>
    <text class="th" x="104" y="252" text-anchor="middle" dominant-baseline="central">FS 드라이버</text>
    <text class="ts" x="104" y="270" text-anchor="middle" dominant-baseline="central">NTFS.sys / ext4</text>
    <text class="ts" x="104" y="283" text-anchor="middle" dominant-baseline="central">inode 탐색 · 읽기/쓰기</text>
  </g>
  <g class="node c-amber">
    <rect x="186" y="232" width="140" height="56" rx="6" stroke-width="0.5"/>
    <text class="th" x="256" y="252" text-anchor="middle" dominant-baseline="central">GPU 드라이버</text>
    <text class="ts" x="256" y="270" text-anchor="middle" dominant-baseline="central">nvidia.sys / amdgpu</text>
    <text class="ts" x="256" y="283" text-anchor="middle" dominant-baseline="central">커맨드 버퍼 제출</text>
  </g>
  <g class="node c-amber">
    <rect x="338" y="232" width="140" height="56" rx="6" stroke-width="0.5"/>
    <text class="th" x="408" y="252" text-anchor="middle" dominant-baseline="central">NIC 드라이버</text>
    <text class="ts" x="408" y="270" text-anchor="middle" dominant-baseline="central">e1000 / r8169</text>
    <text class="ts" x="408" y="283" text-anchor="middle" dominant-baseline="central">TX/RX 링 버퍼</text>
  </g>
  <g class="node c-amber">
    <rect x="490" y="232" width="156" height="56" rx="6" stroke-width="0.5"/>
    <text class="th" x="568" y="252" text-anchor="middle" dominant-baseline="central">HID 드라이버</text>
    <text class="ts" x="568" y="270" text-anchor="middle" dominant-baseline="central">키보드 · 마우스</text>
    <text class="ts" x="568" y="283" text-anchor="middle" dominant-baseline="central">스캔코드 → 이벤트</text>
  </g>

  <!-- 드라이버 → 서브시스템 -->
  <line x1="104" y1="288" x2="104" y2="314" stroke="#BA7517" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="256" y1="288" x2="256" y2="314" stroke="#BA7517" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="408" y1="288" x2="408" y2="314" stroke="#BA7517" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="568" y1="288" x2="568" y2="314" stroke="#BA7517" stroke-width="1" marker-end="url(#arr)"/>

  <!-- 커널 서브시스템 행 -->
  <g class="node c-teal">
    <rect x="34" y="318" width="140" height="56" rx="6" stroke-width="0.5"/>
    <text class="th" x="104" y="338" text-anchor="middle" dominant-baseline="central">VFS</text>
    <text class="ts" x="104" y="356" text-anchor="middle" dominant-baseline="central">가상 파일시스템</text>
    <text class="ts" x="104" y="369" text-anchor="middle" dominant-baseline="central">read · write · open</text>
  </g>
  <g class="node c-teal">
    <rect x="186" y="318" width="140" height="56" rx="6" stroke-width="0.5"/>
    <text class="th" x="256" y="338" text-anchor="middle" dominant-baseline="central">프로세스 스케줄러</text>
    <text class="ts" x="256" y="356" text-anchor="middle" dominant-baseline="central">CPU 타임슬라이스</text>
    <text class="ts" x="256" y="369" text-anchor="middle" dominant-baseline="central">컨텍스트 스위치</text>
  </g>
  <g class="node c-teal">
    <rect x="338" y="318" width="140" height="56" rx="6" stroke-width="0.5"/>
    <text class="th" x="408" y="338" text-anchor="middle" dominant-baseline="central">TCP/IP 스택</text>
    <text class="ts" x="408" y="356" text-anchor="middle" dominant-baseline="central">소켓 버퍼 관리</text>
    <text class="ts" x="408" y="369" text-anchor="middle" dominant-baseline="central">세그먼트 조립·분해</text>
  </g>
  <g class="node c-teal">
    <rect x="490" y="318" width="156" height="56" rx="6" stroke-width="0.5"/>
    <text class="th" x="568" y="338" text-anchor="middle" dominant-baseline="central">입력 서브시스템</text>
    <text class="ts" x="568" y="356" text-anchor="middle" dominant-baseline="central">이벤트 큐 관리</text>
    <text class="ts" x="568" y="369" text-anchor="middle" dominant-baseline="central">포커스 프로세스 전달</text>
  </g>

  <!-- 서브시스템 → syscall -->
  <line x1="104" y1="374" x2="104" y2="400" stroke="#1D9E75" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="256" y1="374" x2="256" y2="400" stroke="#1D9E75" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="408" y1="374" x2="408" y2="400" stroke="#1D9E75" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="568" y1="374" x2="568" y2="400" stroke="#1D9E75" stroke-width="1" marker-end="url(#arr)"/>

  <!-- syscall 경계 -->
  <rect x="34" y="402" width="612" height="26" rx="5" fill="none" stroke="#b4b2a9" stroke-width="0.8" stroke-dasharray="5 3"/>
  <text class="ts" x="340" y="415" text-anchor="middle" dominant-baseline="central">syscall 경계 — 사용자 모드 / 커널 모드</text>

  <!-- syscall → 런타임 -->
  <line x1="104" y1="428" x2="104" y2="454" stroke="#534AB7" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="256" y1="428" x2="256" y2="454" stroke="#534AB7" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="408" y1="428" x2="408" y2="454" stroke="#534AB7" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="568" y1="428" x2="568" y2="454" stroke="#534AB7" stroke-width="1" marker-end="url(#arr)"/>

  <!-- 런타임 -->
  <g class="c-teal">
    <rect x="22" y="456" width="636" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="476" text-anchor="middle" dominant-baseline="central">런타임 · 표준 라이브러리</text>
    <text class="ts" x="340" y="494" text-anchor="middle" dominant-baseline="central">libc · .NET · JVM · DirectX · OpenGL · WASAPI · Win32 API</text>
  </g>

  <line x1="340" y1="512" x2="340" y2="538" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Shell / GUI -->
  <g class="node c-purple">
    <rect x="22" y="542" width="306" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="175" y="562" text-anchor="middle" dominant-baseline="central">Shell (CMD · PowerShell · bash)</text>
    <text class="ts" x="175" y="580" text-anchor="middle" dominant-baseline="central">입력 파싱 → syscall 번역 → 결과 출력</text>
  </g>
  <g class="node c-purple">
    <rect x="352" y="542" width="306" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="505" y="562" text-anchor="middle" dominant-baseline="central">GUI / Window Manager</text>
    <text class="ts" x="505" y="580" text-anchor="middle" dominant-baseline="central">창 배치 · 이벤트 라우팅 · 합성</text>
  </g>

  <line x1="175" y1="598" x2="175" y2="624" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="505" y1="598" x2="505" y2="624" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 앱 행 -->
  <g class="node c-purple">
    <rect x="22" y="628" width="140" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="92" y="648" text-anchor="middle" dominant-baseline="central">브라우저</text>
    <text class="ts" x="92" y="666" text-anchor="middle" dominant-baseline="central">HTML·CSS·JS 렌더링</text>
  </g>
  <g class="node c-purple">
    <rect x="174" y="628" width="140" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="244" y="648" text-anchor="middle" dominant-baseline="central">게임</text>
    <text class="ts" x="244" y="666" text-anchor="middle" dominant-baseline="central">렌더·물리·사운드</text>
  </g>
  <g class="node c-purple">
    <rect x="326" y="628" width="140" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="396" y="648" text-anchor="middle" dominant-baseline="central">음악 플레이어</text>
    <text class="ts" x="396" y="666" text-anchor="middle" dominant-baseline="central">파일 읽기 → DAC 출력</text>
  </g>
  <g class="node c-purple">
    <rect x="478" y="628" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="568" y="648" text-anchor="middle" dominant-baseline="central">워드 / 기타 앱</text>
    <text class="ts" x="568" y="666" text-anchor="middle" dominant-baseline="central">파일 I/O · 화면 출력</text>
  </g>

  <!-- I/O 구분선 -->
  <line x1="22" y1="700" x2="658" y2="700" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text class="ts" x="340" y="712" text-anchor="middle" dominant-baseline="central" style="opacity:0.5">I/O 포트 / 외부 연결</text>

  <!-- SSD/HDD -->
  <g class="node c-gray">
    <rect x="22" y="724" width="148" height="66" rx="8" stroke-width="0.5"/>
    <text class="th" x="96" y="746" text-anchor="middle" dominant-baseline="central">SSD / HDD</text>
    <text class="ts" x="96" y="764" text-anchor="middle" dominant-baseline="central">inode · 파일 데이터</text>
    <text class="ts" x="96" y="778" text-anchor="middle" dominant-baseline="central">NVMe / SATA</text>
  </g>
  <!-- NIC -->
  <g class="node c-gray">
    <rect x="182" y="724" width="148" height="66" rx="8" stroke-width="0.5"/>
    <text class="th" x="256" y="746" text-anchor="middle" dominant-baseline="central">NIC (네트워크카드)</text>
    <text class="ts" x="256" y="764" text-anchor="middle" dominant-baseline="central">이더넷 프레임 송수신</text>
    <text class="ts" x="256" y="778" text-anchor="middle" dominant-baseline="central">PCIe 연결</text>
  </g>
  <!-- 키보드/마우스 -->
  <g class="node c-gray">
    <rect x="342" y="724" width="148" height="66" rx="8" stroke-width="0.5"/>
    <text class="th" x="416" y="746" text-anchor="middle" dominant-baseline="central">키보드 · 마우스</text>
    <text class="ts" x="416" y="764" text-anchor="middle" dominant-baseline="central">USB / PS2 HID</text>
    <text class="ts" x="416" y="778" text-anchor="middle" dominant-baseline="central">IRQ → 드라이버</text>
  </g>
  <!-- 모니터/스피커 -->
  <g class="node c-gray">
    <rect x="502" y="724" width="156" height="66" rx="8" stroke-width="0.5"/>
    <text class="th" x="580" y="746" text-anchor="middle" dominant-baseline="central">모니터 · 스피커</text>
    <text class="ts" x="580" y="764" text-anchor="middle" dominant-baseline="central">HDMI · DisplayPort</text>
    <text class="ts" x="580" y="778" text-anchor="middle" dominant-baseline="central">3.5mm / HDMI 오디오</text>
  </g>

  <!-- 입력 흐름 (장치 → 커널, 점선 위) -->
  <line x1="96"  y1="724" x2="96"  y2="492" stroke="#888780" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <line x1="256" y1="724" x2="256" y2="492" stroke="#888780" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <line x1="416" y1="724" x2="416" y2="492" stroke="#888780" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#arr)"/>

  <!-- 출력 흐름 (GPU/오디오 → 모니터/스피커) -->
  <line x1="424" y1="164" x2="540" y2="724" stroke="#1D9E75" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#arr)"/>
  <line x1="588" y1="164" x2="580" y2="724" stroke="#7F77DD" stroke-width="0.8" stroke-dasharray="3 2" marker-end="url(#arr)"/>

  <!-- I/O → 물리 버스 -->
  <line x1="96"  y1="790" x2="96"  y2="822" stroke="#b4b2a9" stroke-width="0.8" marker-end="url(#arr)"/>
  <line x1="256" y1="790" x2="256" y2="822" stroke="#b4b2a9" stroke-width="0.8" marker-end="url(#arr)"/>
  <line x1="416" y1="790" x2="416" y2="822" stroke="#b4b2a9" stroke-width="0.8" marker-end="url(#arr)"/>
  <line x1="580" y1="790" x2="580" y2="822" stroke="#b4b2a9" stroke-width="0.8" marker-end="url(#arr)"/>

  <!-- 물리 버스 -->
  <rect x="22" y="824" width="636" height="26" rx="5" fill="none" stroke="#b4b2a9" stroke-width="0.5" stroke-dasharray="5 3"/>
  <text class="ts" x="340" y="837" text-anchor="middle" dominant-baseline="central">물리 버스 (NVMe · SATA · USB · PCIe · I2C · HDMI · DisplayPort)</text>

  <!-- 범례 -->
  <g class="c-teal">  <rect x="22"  y="866" width="10" height="10" rx="2"/></g>
